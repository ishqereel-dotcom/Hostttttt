{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block body %}
<div class="glass card center">
  <h1>Register</h1><p class="sub">Free account banao, bot upload karo, admin approve karega.</p>
  {% if err %}<div class="err">{{ err }}</div>{% endif %}
  <form method="post" action="/register">
    <label>Email</label><input name="email" type="email" required autofocus>
    <label>Password</label><input name="password" type="password" minlength="6" required>
    <div style="margin-top:18px"><button class="btn primary" type="submit">Create account</button></div>
  </form>
  <p class="muted" style="margin-top:14px">Pehle se account? <a href="/login" style="text-decoration:underline">Login</a></p>
</div>
{% endblock %}
