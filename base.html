<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}BotPanel{% endblock %}</title>
<style>
:root{
  --bg1:#f7f8fa; --bg2:#e9ecf2; --ink:#0b0c0e; --ink2:#5c6270;
  --line:rgba(0,0,0,.10); --glass:rgba(255,255,255,.55);
  --glass2:rgba(255,255,255,.30); --shadow:0 8px 32px rgba(15,18,25,.12);
  --radius:20px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg1:#08090b; --bg2:#141619; --ink:#f2f4f7; --ink2:#9aa2b1;
    --line:rgba(255,255,255,.12); --glass:rgba(255,255,255,.07);
    --glass2:rgba(255,255,255,.03); --shadow:0 8px 40px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; color:var(--ink); font-family:ui-sans-serif,system-ui,"Segoe UI",Inter,sans-serif;
  background:
    radial-gradient(1200px 700px at 8% -10%, rgba(255,255,255,.9), transparent 60%),
    radial-gradient(900px 700px at 105% 5%, rgba(120,140,190,.28), transparent 55%),
    radial-gradient(1000px 800px at 50% 115%, rgba(0,0,0,.08), transparent 60%),
    linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
}
@media (prefers-color-scheme: dark){
  body{background:
    radial-gradient(900px 600px at 10% -10%, rgba(120,150,255,.18), transparent 60%),
    radial-gradient(800px 700px at 100% 0%, rgba(255,255,255,.07), transparent 55%),
    linear-gradient(160deg,var(--bg1),var(--bg2));}
}
/* liquid blobs */
body::before,body::after{
  content:""; position:fixed; filter:blur(70px); opacity:.55; border-radius:50%;
  pointer-events:none; z-index:0; animation:float 18s ease-in-out infinite alternate;
}
body::before{width:46vw;height:46vw;left:-12vw;top:-10vw;background:radial-gradient(circle,rgba(255,255,255,.95),transparent 65%)}
body::after{width:40vw;height:40vw;right:-10vw;bottom:-12vw;background:radial-gradient(circle,rgba(90,110,180,.5),transparent 65%);animation-delay:-8s}
@keyframes float{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(4vw,3vh,0) scale(1.12)}}

.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:26px 18px 60px}
.glass{
  background:linear-gradient(150deg,var(--glass),var(--glass2));
  border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow);
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  position:relative; overflow:hidden;
}
.glass::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.7) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 68%,rgba(255,255,255,.35) 100%);
  opacity:.5; mix-blend-mode:screen;
}
nav{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 18px;margin-bottom:22px}
.brand{font-weight:800;letter-spacing:-.02em;font-size:19px}
.brand span{opacity:.55;font-weight:600}
nav .links{display:flex;gap:10px;flex-wrap:wrap}
a{color:inherit;text-decoration:none}
h1{font-size:clamp(22px,3.4vw,32px);margin:0 0 6px;letter-spacing:-.03em;font-weight:800}
h2{font-size:17px;margin:22px 0 10px;font-weight:700}
p.sub{color:var(--ink2);margin:0 0 20px;font-size:14.5px}
.card{padding:20px;margin-bottom:16px}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:14px;
  border:1px solid var(--line); background:rgba(255,255,255,.35); color:var(--ink);
  font-weight:700;font-size:14px;cursor:pointer;backdrop-filter:blur(10px);
  transition:transform .15s,background .2s,box-shadow .2s;
}
@media (prefers-color-scheme: dark){.btn{background:rgba(255,255,255,.08)}}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.14)}
.btn.primary{background:var(--ink);color:#fff;border-color:transparent}
@media (prefers-color-scheme: dark){.btn.primary{background:#fff;color:#000}}
.btn.danger{color:#c02626;border-color:rgba(192,38,38,.35)}
@media (prefers-color-scheme: dark){.btn.danger{color:#ff8a8a;border-color:rgba(255,120,120,.3)}}
.btn.ok{color:#0f7a35;border-color:rgba(15,122,53,.35)}
@media (prefers-color-scheme: dark){.btn.ok{color:#7ce39b}}
input,textarea,select{
  width:100%;padding:11px 13px;border-radius:13px;border:1px solid var(--line);
  background:rgba(255,255,255,.45);color:var(--ink);font:inherit;font-size:14px;
  backdrop-filter:blur(8px); outline:none; transition:border .2s,box-shadow .2s;
}
@media (prefers-color-scheme: dark){input,textarea,select{background:rgba(255,255,255,.06)}}
input:focus,textarea:focus,select:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(120,140,190,.22)}
label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.row{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media (max-width:640px){.row{grid-template-columns:1fr}}
.list{display:grid;gap:10px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border-radius:14px;
  border:1px solid var(--line);background:rgba(255,255,255,.3);flex-wrap:wrap}
@media (prefers-color-scheme: dark){.item{background:rgba(255,255,255,.05)}}
.pill{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--line)}
.pill.running{color:#0f7a35;background:rgba(15,122,53,.12)}
.pill.pending{color:#8a5a00;background:rgba(180,120,0,.14)}
.pill.rejected{color:#c02626;background:rgba(192,38,38,.12)}
.pill.stopped,.pill.error{color:var(--ink2);background:rgba(120,120,140,.14)}
@media (prefers-color-scheme: dark){
 .pill.running{color:#7ce39b}.pill.pending{color:#ffcf6b}.pill.rejected{color:#ff9a9a}
}
.err{padding:11px 14px;border-radius:12px;background:rgba(192,38,38,.12);
  border:1px solid rgba(192,38,38,.3);color:#c02626;font-size:13.5px;font-weight:600}
@media (prefers-color-scheme: dark){.err{color:#ff9a9a}}
pre{background:rgba(0,0,0,.82);color:#e9eef7;padding:14px;border-radius:14px;overflow:auto;
  font-size:12.5px;line-height:1.55;max-height:520px;margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.logs{background:rgba(0,0,0,.86);color:#c9f7d5;padding:12px;border-radius:14px;font-size:12px;
  max-height:300px;overflow:auto;white-space:pre-wrap;font-family:ui-monospace,monospace}
.files{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.files a{font-size:12px;padding:5px 10px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.35)}
@media (prefers-color-scheme: dark){.files a{background:rgba(255,255,255,.07)}}
.files a.on{background:var(--ink);color:#fff;border-color:transparent}
@media (prefers-color-scheme: dark){.files a.on{background:#fff;color:#000}}
.muted{color:var(--ink2);font-size:13px}
.center{max-width:430px;margin:9vh auto}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13.5px}
.kv b{color:var(--ink2);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <nav class="glass">
    <div class="brand">BOT<span>PANEL</span></div>
    <div class="links">
      {% if user %}
        <a class="btn" href="/dashboard">Mere Bots</a>
        <a class="btn" href="/bots/new">+ Naya Bot</a>
        {% if user.adm %}<a class="btn" href="/admin">Admin</a>{% endif %}
        <a class="btn" href="/logout">Logout</a>
      {% endif %}
    </div>
  </nav>
  {% block body %}{% endblock %}
</div>
</body>
</html>
